<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting — Ehsan Negahdar</title>
    <link rel="canonical" href="https://dutch-panda.github.io/" />
    <meta http-equiv="refresh" content="0; url=https://dutch-panda.github.io/" />
    <script>
      window.location.replace(
        'https://dutch-panda.github.io/' + window.location.search + window.location.hash
      );
    </script>
  </head>
  <body style="background: #0b0b0d; color: #f3f4f6; font-family: system-ui, sans-serif; padding: 48px; text-align: center;">
    <p>
      This portfolio has moved to
      <a href="https://dutch-panda.github.io/" style="color: #ff7b29;">https://dutch-panda.github.io/</a>.
    </p>
  </body>
</html>
